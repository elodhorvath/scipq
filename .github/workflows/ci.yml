name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            !node_modules/**

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race

  # Windows (issue #56): the #54 pre-commit review caught filepath addressing
  # of the embedded FS that would have broken every skill subcommand on the
  # released Windows archives. TestSkillEmbeddedPathsAreSlashForm guards the
  # trap logically on every runner; this job makes it physical and exercises
  # filepath.FromSlash install paths on a real Windows host.
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

  scipq-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build scipq
        run: go build -o scipq ./cmd/scipq

      - name: Smoke — missing index exits 2
        run: |
          set +e
          ./scipq map --index /nonexistent/index.scip
          code=$?
          set -e
          test "$code" -eq 2 || (echo "expected exit 2, got $code" && exit 1)

      - name: Smoke — arg violations precede missing index (exit 1)
        run: |
          set +e
          ./scipq map extra --index /nonexistent/index.scip
          code=$?
          set -e
          test "$code" -eq 1 || (echo "expected exit 1, got $code" && exit 1)

      - name: Smoke — callers on committed fixture
        run: |
          set +e
          ./scipq callers Animal#Speak --index testdata/index.scip > /tmp/callers.out 2>/tmp/callers.err
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)
          grep -q "Animal#Speak().  (3 sites)" /tmp/callers.out || (echo "missing resolved header" && exit 1)
          grep -q "services/zoo.go:11     call" /tmp/callers.out || (echo "missing direct call site" && exit 1)

      - name: Smoke — callers unknown symbol exits 1
        run: |
          set +e
          ./scipq callers NoSuchSymbol --index testdata/index.scip
          code=$?
          set -e
          test "$code" -eq 1 || (echo "expected exit 1, got $code" && exit 1)

      - name: Smoke — callers --json is valid JSON
        run: |
          ./scipq callers Helper --index testdata/index.scip --json | python3 -m json.tool > /dev/null

      - name: Smoke — blast on synthetic diff
        run: |
          set +e
          printf 'diff --git a/animal.go b/animal.go\n--- a/animal.go\n+++ b/animal.go\n@@ -2,1 +3,1 @@\n+changed\n' | ./scipq blast --index testdata/index.scip > /tmp/blast.out 2>/tmp/blast.err
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)
          grep -q "1 touched" /tmp/blast.out || (echo "missing touched count" && exit 1)
          grep -q "Speak" /tmp/blast.out || (echo "missing touched symbol" && exit 1)

      - name: Smoke — blast empty diff exits 0
        run: |
          set +e
          printf '' | ./scipq blast --index testdata/index.scip > /tmp/blastempty.out 2>/dev/null
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)

      - name: Smoke — blast TTY stdin exits 1
        run: |
          set +e
          ./scipq blast --index testdata/index.scip < /dev/null
          code=$?
          set -e
          test "$code" -eq 1 || (echo "expected exit 1, got $code" && exit 1)

      # skeleton / dead / skill (issue #56): the pinned agent-UX contract
      # (exit codes, stdout data-only) had zero smoke coverage. Expectations
      # are measured against the committed fixture, not invented.

      - name: Smoke — skeleton on committed fixture
        run: |
          set +e
          ./scipq skeleton animal.go --index testdata/index.scip > /tmp/skeleton.out 2>/tmp/skeleton.err
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)
          # Fixed-string greps: the output is column-aligned with runs of spaces.
          grep -qF "animal.go  (2 symbols)" /tmp/skeleton.out || (echo "missing file header" && exit 1)
          grep -qF "2  type    Animal  +exported" /tmp/skeleton.out || (echo "missing Animal type row" && exit 1)
          grep -qF "3  method  Speak  +exported" /tmp/skeleton.out || (echo "missing Speak method row" && exit 1)

      - name: Smoke — skeleton unknown file exits 1
        run: |
          set +e
          ./scipq skeleton nosuchfile.go --index testdata/index.scip > /tmp/skeleton404.out 2>/tmp/skeleton404.err
          code=$?
          set -e
          test "$code" -eq 1 || (echo "expected exit 1, got $code" && exit 1)
          grep -q 'scipq: no indexed file matching' /tmp/skeleton404.err \
            || (echo "missing scipq: stderr diagnostic" && exit 1)

      - name: Smoke — dead on committed fixture
        run: |
          set +e
          ./scipq dead --index testdata/index.scip > /tmp/dead.out 2>/tmp/dead.err
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)
          grep -qF "no dead symbols" /tmp/dead.out || (echo "missing no-dead-symbols line" && exit 1)

      - name: Smoke — skill print --list is the exact 7-page inventory
        run: |
          set +e
          ./scipq skill print --list > /tmp/skilllist.out 2>/tmp/skilllist.err
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)
          # Byte-exact line list, same style as the Go fixture
          # (TestSkillEmbeddedPathsAreSlashForm).
          printf '%s\n' \
            'SKILL.md' \
            'reference/indexing.md' \
            'reference/verbs/blast.md' \
            'reference/verbs/callers.md' \
            'reference/verbs/dead.md' \
            'reference/verbs/map.md' \
            'reference/verbs/skeleton.md' > /tmp/skilllist.expected
          diff -u /tmp/skilllist.expected /tmp/skilllist.out || (echo "skill page inventory drifted" && exit 1)

      - name: Smoke — skill install into temp target
        run: |
          set +e
          ./scipq skill install --target "$RUNNER_TEMP/skill" > /tmp/skillinstall.out 2>/tmp/skillinstall.err
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)
          grep -qF "installed scipq skill" /tmp/skillinstall.out || (echo "missing install summary" && exit 1)
          test -s "$RUNNER_TEMP/skill/.scipq-version" || (echo "missing non-empty .scipq-version" && exit 1)
          test "$(find "$RUNNER_TEMP/skill" -type f | wc -l)" -eq 8 || (echo "expected 8 installed files" && exit 1)

      - name: Smoke — skill snippet contains decision table
        run: |
          set +e
          ./scipq skill snippet > /tmp/skillsnippet.out 2>/tmp/skillsnippet.err
          code=$?
          set -e
          test "$code" -eq 0 || (echo "expected exit 0, got $code" && exit 1)
          grep -qF "| Question | Verb |" /tmp/skillsnippet.out || (echo "missing decision-table header" && exit 1)
          grep -qF "scipq skill print" /tmp/skillsnippet.out || (echo "missing skill print pointer" && exit 1)

      - name: Smoke — skill snippet --json is valid JSON
        run: |
          ./scipq skill snippet --json | python3 -m json.tool > /dev/null

  # Self-index (issue #11): dogfood — index this repo with scip-go and
  # publish index.scip as a build artifact. Info-only: failure here does
  # not block merge until the job has proven stable.
  self-index:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install scip-go v0.2.7
        run: |
          # Download under the asset's real filename: the committed checksum
          # file lists that name, and sha256sum -c resolves it relative to cwd.
          curl -fsSL -o /tmp/scip-go-linux-amd64.tar.gz \
            https://github.com/scip-code/scip-go/releases/download/v0.2.7/scip-go-linux-amd64.tar.gz
          # Tamper check (issue #39): verify against the checksum recorded
          # from the release's .sha256 sidecar, independently confirmed.
          cd /tmp && sha256sum -c "$GITHUB_WORKSPACE/.github/workflows/scip-go-v0.2.7-linux-amd64.sha256"
          tar -xzf /tmp/scip-go-linux-amd64.tar.gz -C /usr/local/bin scip-go
          scip-go --version

      - name: Index this repo
        run: scip-go index ./... --output index.scip

      - name: Index sanity — size and symbol count
        run: |
          ls -lh index.scip
          go run ./cmd/scipq map --index index.scip --json > /tmp/selfmap.json
          python3 - <<'EOF'
          import json
          with open("/tmp/selfmap.json") as f:
              m = json.load(f)
          print(f"self-index: {m['files']} files, {m['symbols']} symbols")
          assert m["files"] > 0, "self-index produced no files"
          assert m["symbols"] > 0, "self-index produced no symbols"
          EOF

      - name: Dogfood — scipq map on its own index
        run: go run ./cmd/scipq map --index index.scip

      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: index.scip
          path: index.scip
          retention-days: 30
          if-no-files-found: error
